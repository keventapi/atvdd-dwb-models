    <h1>Cadastrar novo autor</h1>

    <form method="POST">
        {% csrf_token %}

        <div>
            {{ form.name.label_tag }}
            {{ form.name }}

            {% for error in form.name.errors %}
                <p class="error">{{ error }}</p>
            {% endfor %}
        </div>

        <div>
            {{ form.nationality.label_tag }}
            {{ form.nationality }}

            {% for error in form.nationality.errors %}
                <p class="error">{{ error }}</p>
            {% endfor %}
        </div>

        <button type="submit">Cadastrar autor</button>
    </form>
