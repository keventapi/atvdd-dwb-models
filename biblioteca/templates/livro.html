<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% if edited %}Editar Livro{% else %}Novo Livro{% endif %}</title>
</head>
<body>
    <h1>{% if edited %}Editar Livro{% else %}Cadastrar Novo Livro{% endif %}</h1>
    
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Salvar</button>
    </form>

    <br>
    <a href="{% url 'index' %}">Cancelar / Voltar</a>
</body>
</html>
