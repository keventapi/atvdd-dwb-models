<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Autor: {{ autor.nome }}</title>
</head>
<body>
    <h1>Autor: {{ autor.nome }}</h1>
    
    <h2>Livros associados:</h2>
    <ul>
        {% for livro in livros %}
            <li>
                <a href="{% url 'livro_detalhes' livro.pk %}">{{ livro.titulo }}</a>
            </li>
        {% empty %}
            <li>Este autor não possui livros cadastrados.</li>
        {% endfor %}
    </ul>

    <hr>
    <a href="{% url 'index' %}">Voltar para a Home</a>
</body>
</html>
