<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Mini Biblioteca - Início</title>
</head>
<body>
    <h1>Lista de Livros</h1>
    
    <nav>
        <a href="{% url 'criar_livro' %}">Adicionar Livro</a> | 
        <a href="{% url 'criar_autor' %}">Adicionar Autor</a> | 
        <a href="{% url 'sobre' %}">Sobre</a>
    </nav>

    <hr>

    <ul>
        {% for livro in livros %}
            <li>
                <a href="{% url 'livro_detalhes' livro.pk %}">{{ livro.titulo }}</a>
            </li>
        {% empty %}
            <li>Nenhum livro cadastrado no momento.</li>
        {% endfor %}
    </ul>
</body>
</html>
